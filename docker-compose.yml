services:
  api:
    build: .
    image: podcastapi:latest
    container_name: podcastapi
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      # Top-level config key -> plain name.
      ApiKey: ${API_KEY:?set API_KEY in .env (copy .env.example)}
      # Nested key ConnectionString:Default -> double underscore.
      ConnectionString__Default: "Data Source=/app/data/podcast.db"
      Sync__Enabled: "${SYNC_ENABLED:-false}"
      Sync__IntervalHours: "${SYNC_INTERVAL_HOURS:-24}"
    volumes:
      - podcast-data:/app/data
    restart: unless-stopped

volumes:
  podcast-data:
